name: Integrate Video Editor

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Integrate editor into app.py
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('app.py')
          page = Path('pages/4_🎬_Video_Editor.py')
          text = app.read_text(encoding='utf-8')

          old_tabs = 'recognition_tab,correction_tab,translation_tab=st.tabs(["🎙️ Speech Recognition","✨ AI Correction","🌐 Translation"])'
          new_tabs = 'recognition_tab,correction_tab,translation_tab,video_editor_tab=st.tabs(["🎙️ Speech Recognition","✨ AI Correction","🌐 Translation","🎬 Video Editor"])'
          if old_tabs not in text:
              raise SystemExit('Expected frozen tab declaration was not found; refusing to modify app.py.')

          if 'video_editor_tab' in text:
              raise SystemExit('Video editor already integrated; nothing to do.')

          text = text.replace(old_tabs, new_tabs, 1)

          editor = page.read_text(encoding='utf-8')
          marker = '\nst.markdown(\n    """\n    <style>'
          if marker not in editor:
              raise SystemExit('Could not locate editor UI marker.')

          helper, ui = editor.split(marker, 1)
          helper_lines = helper.splitlines()
          helper_lines = [line for line in helper_lines if not line.startswith('import ') and not line.startswith('from ')]
          helper = '\n'.join(helper_lines).replace('find_binary', 'editor_find_binary').replace('format_time', 'editor_format_time').replace('parse_time', 'editor_parse_time').replace('parse_srt', 'editor_parse_srt').replace('ass_escape', 'editor_ass_escape').replace('ass_time', 'editor_ass_time').replace('ass_color', 'editor_ass_color').replace('build_ass', 'editor_build_ass').replace('run_ffmpeg', 'editor_run_ffmpeg')
          ui = ('st.markdown(\n    """\n    <style>' + ui).replace('parse_srt(', 'editor_parse_srt(').replace('format_time(', 'editor_format_time(').replace('parse_time(', 'editor_parse_time(').replace('build_ass(', 'editor_build_ass(').replace('run_ffmpeg(', 'editor_run_ffmpeg(')

          # Remove the page-only set_page_config call if present in helper text.
          helper = re.sub(r'\\nst\\.set_page_config\\([^\\n]*\\)\\n?', '\\n', helper)

          # The editor's Streamlit UI belongs inside the fourth tab.
          ui = '\n'.join('    ' + line if line else '' for line in ui.splitlines())
          integration = '\n\n' + helper.strip() + '\n\nwith video_editor_tab:\n' + ui + '\n'
          text = text + integration

          app.write_text(text, encoding='utf-8')
          page.unlink()
          Path('.github/workflows/integrate-video-editor.yml').unlink()
          PY

      - name: Commit integrated app.py
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py pages/ .github/workflows/integrate-video-editor.yml
          git commit -m "Add video subtitle editor as fourth tab" || echo "No changes to commit"
          git push
