name: Integrate Video Editor v2

on:
  push:
    branches: [main]

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[integrated]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Integrate editor and multilingual rendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          text = p.read_text(encoding='utf-8')

          # Preserve the frozen recognition / correction / translation implementation.
          # Only replace the tab declaration and append the new editor implementation.
          tab_re = re.compile(r'recognition_tab,correction_tab,translation_tab\s*=\s*st\.tabs\(\[.*?\]\)')
          replacement = 'recognition_tab,correction_tab,translation_tab,video_editor_tab=st.tabs(["🎙️ Speech Recognition","✨ AI Correction","🌐 Translation","🎬 Video Editor"])'
          if 'video_editor_tab' not in text:
              text, n = tab_re.subn(replacement, text, count=1)
              if n != 1:
                  raise SystemExit('Could not locate the existing three-tab declaration; refusing to modify app.py.')

          if 'def editor_parse_srt_v2(' in text:
              raise SystemExit('Editor v2 already integrated; nothing to do.')

          editor = r'''

# ==================== VIDEO EDITOR V2 ====================
# This module is intentionally isolated from the frozen recognition/AI/translation code above.

def editor_parse_srt_time_v2(value):
    value = value.strip().replace('.', ',')
    m = re.match(r"^(\d+):(\d+):(\d+),(\d+)$", value)
    if not m:
        raise ValueError(value)
    h, mi, s, ms = map(int, m.groups())
    return h * 3600 + mi * 60 + s + ms / 1000


def editor_parse_srt_v2(content):
    # Keep physical line breaks. This is essential for bilingual SRTs where
    # source and translated text intentionally occupy separate subtitle lines.
    blocks = re.split(r"\n\s*\n", content.replace("\r\n", "\n").replace("\r", "\n").strip())
    result = []
    for block in blocks:
        lines = block.splitlines()
        ti = next((i for i, line in enumerate(lines) if '-->' in line), None)
        if ti is None or ti + 1 >= len(lines):
            continue
        try:
            a, b = [x.strip().split()[0] for x in lines[ti].split('-->', 1)]
            start = editor_parse_srt_time_v2(a)
            end = editor_parse_srt_time_v2(b)
        except Exception:
            continue
        subtitle = "\n".join(x.rstrip() for x in lines[ti + 1:]).strip()
        if subtitle and end > start:
            result.append([start, end, subtitle])
    return result


def editor_ass_escape_v2(text):
    return (str(text).replace('\\', r'\\').replace('{', r'\\{').replace('}', r'\\}'))


def editor_ass_color_v2(hex_color):
    h = str(hex_color).lstrip('#')
    if len(h) != 6:
        h = 'FFFFFF'
    r, g, b = h[0:2], h[2:4], h[4:6]
    return f"&H00{b}{g}{r}"


def editor_script_font_v2(ch):
    o = ord(ch)
    if 0x4E00 <= o <= 0x9FFF or 0x3400 <= o <= 0x4DBF:
        return 'Noto Sans CJK SC'
    if 0x3040 <= o <= 0x30FF:
        return 'Noto Sans CJK JP'
    if 0xAC00 <= o <= 0xD7AF:
        return 'Noto Sans CJK KR'
    if 0x0900 <= o <= 0x097F:
        return 'Noto Sans Devanagari'
    if 0x0600 <= o <= 0x06FF or 0x0750 <= o <= 0x077F:
        return 'Noto Sans Arabic'
    if 0x0E00 <= o <= 0x0E7F:
        return 'Noto Sans Thai'
    if 0x0590 <= o <= 0x05FF:
        return 'Noto Sans Hebrew'
    if 0x0400 <= o <= 0x04FF:
        return 'Noto Sans'
    return None


def editor_runs_with_fonts_v2(text, default_font='Noto Sans'):
    # ASS override font tags are inserted per script run so libass can render
    # scripts that are not covered by one universal font family.
    out = []
    current_font = None
    buf = []
    def flush():
        nonlocal buf, current_font
        if not buf:
            return
        chunk = editor_ass_escape_v2(''.join(buf))
        if current_font and current_font != default_font:
            out.append(r'{\fn' + current_font + '}' + chunk + r'{\fn' + default_font + '}')
        else:
            out.append(chunk)
        buf = []
    for ch in str(text):
        if ch in '\r\n':
            flush()
            out.append(r'\N')
            current_font = None
            continue
        font = editor_script_font_v2(ch) or default_font
        if current_font is None:
            current_font = font
        if font != current_font:
            flush()
            current_font = font
        buf.append(ch)
    flush()
    return ''.join(out)


def editor_char_width_v2(ch):
    o = ord(ch)
    if ch.isspace():
        return 0.38
    if 0x4E00 <= o <= 0x9FFF or 0x3400 <= o <= 0x4DBF or 0x3040 <= o <= 0x30FF or 0xAC00 <= o <= 0xD7AF:
        return 1.0
    if 0x0900 <= o <= 0x097F or 0x0600 <= o <= 0x06FF or 0x0E00 <= o <= 0x0E7F or 0x0590 <= o <= 0x05FF:
        return 0.95
    if o >= 0x1F300:
        return 1.0
    return 0.55


def editor_wrap_line_v2(line, max_units=34):
    line = str(line).strip()
    if not line:
        return ''
    words = line.split(' ')
    # CJK text has no spaces, so use character-aware wrapping there.
    if len(words) == 1 and any(editor_char_width_v2(c) >= 0.95 for c in line):
        out, buf, units = [], [], 0.0
        for ch in line:
            w = editor_char_width_v2(ch)
            if buf and units + w > max_units:
                out.append(''.join(buf))
                buf, units = [], 0.0
            buf.append(ch)
            units += w
        if buf:
            out.append(''.join(buf))
        return '\n'.join(out)

    out, buf, units = [], [], 0.0
    for word in words:
        ww = sum(editor_char_width_v2(c) for c in word)
        sep = 0.38 if buf else 0.0
        if buf and units + sep + ww > max_units:
            out.append(' '.join(buf))
            buf, units = [word], ww
        else:
            buf.append(word)
            units += sep + ww
    if buf:
        out.append(' '.join(buf))
    return '\n'.join(out)


def editor_wrap_bilingual_v2(text, max_units=34):
    # Preserve the source/translation two-line structure and wrap each side independently.
    return '\n'.join(editor_wrap_line_v2(part, max_units) for part in str(text).replace('\r\n', '\n').replace('\r', '\n').split('\n'))


def editor_ass_time_v2(seconds):
    total = max(0, int(round(float(seconds) * 100)))
    cs = total % 100
    total //= 100
    s = total % 60
    total //= 60
    m = total % 60
    h = total // 60
    return f'{h}:{m:02d}:{s:02d}.{cs:02d}'


def editor_build_ass_v2(segments, font_name, font_size, text_color, bold, italic, underline,
                         position, margin_v, outline_width, outline_color, wrap_units):
    align = {'Bottom': 2, 'Middle': 5, 'Top': 8}[position]
    border = max(0, int(outline_width))
    primary = editor_ass_color_v2(text_color)
    outline = editor_ass_color_v2(outline_color)
    b = -1 if bold else 0
    i = -1 if italic else 0
    u = -1 if underline else 0
    lines = [
        '[Script Info]',
        'ScriptType: v4.00+',
        'PlayResX: 1920',
        'PlayResY: 1080',
        'WrapStyle: 2',
        'ScaledBorderAndShadow: yes',
        '',
        '[V4+ Styles]',
        'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
        f'Style: Default,{font_name},{font_size},{primary},&H00FFFFFF,{outline},&H00000000,{b},{i},{u},0,100,100,0,0,1,{border},0,{align},80,80,{int(margin_v)},1',
        '',
        '[Events]',
        'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text',
    ]
    for start, end, raw in segments:
        wrapped = editor_wrap_bilingual_v2(raw, wrap_units)
        rendered = editor_runs_with_fonts_v2(wrapped, font_name)
        lines.append(f'Dialogue: 0,{editor_ass_time_v2(start)},{editor_ass_time_v2(end)},Default,,0,0,0,,{rendered}')
    return '\n'.join(lines) + '\n'


def editor_find_ffmpeg_v2():
    for name in ('ffmpeg',):
        path = shutil.which(name)
        if path:
            return path
    for path in ('/usr/bin/ffmpeg', '/usr/local/bin/ffmpeg', '/opt/homebrew/bin/ffmpeg', '/opt/conda/bin/ffmpeg'):
        if os.path.isfile(path) and os.access(path, os.X_OK):
            return path
    return None


def editor_render_video_v2(video_path, ass_path, output_path):
    ffmpeg = editor_find_ffmpeg_v2()
    if not ffmpeg:
        raise RuntimeError('FFmpeg was not found. Add ffmpeg to packages.txt and redeploy.')
    # libass reads fontconfig's multilingual font database. fontsdir points to
    # the common Debian font tree when present, while fontconfig provides fallback.
    vf = "subtitles='" + str(ass_path).replace('\\', '\\\\').replace("'", "\\'") + "'"
    cmd = [ffmpeg, '-y', '-hide_banner', '-loglevel', 'error', '-i', str(video_path),
           '-vf', vf, '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '18',
           '-c:a', 'aac', '-b:a', '192k', '-movflags', '+faststart', str(output_path)]
    r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
    if r.returncode != 0:
        raise RuntimeError('Subtitle rendering failed.\n' + (r.stderr or 'Unknown FFmpeg error.')[-2500:])


with video_editor_tab:
    st.subheader('🎬 Video Subtitle Editor')
    st.caption('Edit SRT subtitles, preserve bilingual line breaks, auto-wrap long lines, and burn multilingual subtitles with transparent backgrounds.')

    col1, col2 = st.columns(2)
    with col1:
        editor_video = st.file_uploader('Upload video', type=SUPPORTED_TYPES, key='editor_v2_video')
    with col2:
        editor_srt = st.file_uploader('Upload SRT subtitle', type=['srt'], key='editor_v2_srt')

    if editor_video and editor_srt:
        if 'editor_v2_data' not in st.session_state or st.session_state.get('editor_v2_srt_name') != editor_srt.name:
            st.session_state.editor_v2_data = editor_parse_srt_v2(editor_srt.getvalue().decode('utf-8-sig', errors='replace'))
            st.session_state.editor_v2_srt_name = editor_srt.name

        data = st.session_state.editor_v2_data
        if not data:
            st.error('No valid subtitle cues were found in this SRT.')
        else:
            st.video(editor_video)
            st.markdown(f'**{len(data)} subtitle cues loaded**')
            for idx, cue in enumerate(data):
                with st.expander(f'Subtitle {idx + 1} · {format_time(cue[0])}', expanded=(idx == 0)):
                    c1, c2 = st.columns(2)
                    with c1:
                        cue[0] = st.number_input('Start (seconds)', min_value=0.0, value=float(cue[0]), step=0.1, key=f'e2_s_{idx}')
                    with c2:
                        cue[1] = st.number_input('End (seconds)', min_value=0.0, value=float(cue[1]), step=0.1, key=f'e2_e_{idx}')
                    cue[2] = st.text_area('Subtitle text', value=cue[2], height=110, key=f'e2_t_{idx}')

            st.markdown('### 🎨 Subtitle style')
            s1, s2, s3 = st.columns(3)
            with s1:
                font_name = st.selectbox('Base font', ['Noto Sans', 'Noto Sans CJK SC', 'DejaVu Sans', 'Liberation Sans'], index=0, key='e2_font')
                font_size = st.slider('Font size', 18, 96, 42, key='e2_size')
                text_color = st.color_picker('Text color', '#FFFFFF', key='e2_text_color')
            with s2:
                bold = st.checkbox('Bold', True, key='e2_bold')
                italic = st.checkbox('Italic', False, key='e2_italic')
                underline = st.checkbox('Underline', False, key='e2_under')
                position = st.selectbox('Position', ['Bottom', 'Middle', 'Top'], index=0, key='e2_pos')
                margin_v = st.slider('Vertical margin', 10, 240, 60, key='e2_margin')
            with s3:
                outline_width = st.slider('Outline width', 0, 8, 3, key='e2_outline')
                outline_color = st.color_picker('Outline color', '#000000', key='e2_outline_color')
                wrap_units = st.slider('Auto-wrap width', 18, 60, 34, key='e2_wrap')
                st.caption('Wrapping is applied separately to the original and translated lines. No black subtitle box is added.')

            if st.button('🎬 Render video', type='primary', key='e2_render'):
                work = tempfile.mkdtemp(prefix='hinglish_editor_')
                try:
                    video_suffix = Path(editor_video.name).suffix.lower() or '.mp4'
                    video_path = Path(work) / ('input' + video_suffix)
                    ass_path = Path(work) / 'subtitles.ass'
                    output_path = Path(work) / 'output.mp4'
                    video_path.write_bytes(editor_video.getbuffer())
                    ass_path.write_text(editor_build_ass_v2(data, font_name, font_size, text_color, bold, italic, underline,
                                                            position, margin_v, outline_width, outline_color, wrap_units), encoding='utf-8-sig')
                    with st.spinner('Rendering multilingual subtitles…'):
                        editor_render_video_v2(video_path, ass_path, output_path)
                    st.success('Video rendered successfully.')
                    st.video(str(output_path))
                    st.download_button('⬇️ Download MP4', data=output_path.read_bytes(), file_name=Path(editor_video.name).stem + '_subtitled.mp4', mime='video/mp4', key='e2_download')
                except Exception as exc:
                    st.error(str(exc))
                finally:
                    shutil.rmtree(work, ignore_errors=True)
'''

          text += editor
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install multilingual font packages
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages.txt')
          existing = p.read_text(encoding='utf-8').splitlines() if p.exists() else []
          needed = ['ffmpeg', 'fontconfig', 'fonts-noto-core', 'fonts-noto-cjk', 'fonts-noto-extra', 'fonts-noto-mono']
          out = existing[:]
          for item in needed:
              if item not in out:
                  out.append(item)
          p.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

      - name: Remove old editor page if present
        run: |
          if [ -f 'pages/4_🎬_Video_Editor.py' ]; then rm 'pages/4_🎬_Video_Editor.py'; fi

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Commit integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py packages.txt 'pages/4_🎬_Video_Editor.py' || true
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat: integrate multilingual video editor [integrated]'
          git push
