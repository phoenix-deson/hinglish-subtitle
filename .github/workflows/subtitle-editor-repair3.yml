name: Restore subtitle editor

on:
  push:
    paths:
      - '.github/workflows/subtitle-editor-repair3.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore app.py
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          section = Path('editor_section.py.txt').read_text(encoding='utf-8')
          if 'EDITOR_CODE_PLACEHOLDER' not in text:
              raise SystemExit('Placeholder not found; refusing to overwrite app.py')
          app.write_text(text.replace('EDITOR_CODE_PLACEHOLDER', section.rstrip()), encoding='utf-8')
          PY
      - name: Update multilingual font packages
        run: |
          printf '%s\n' ffmpeg fontconfig fonts-noto-cjk fonts-noto-core fonts-noto-extra fonts-noto-mono fonts-noto-color-emoji > packages.txt
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Remove repair files
        run: |
          rm -f editor_section.py.txt
          rm -f .github/workflows/subtitle-editor-repair.yml
          rm -f .github/workflows/subtitle-editor-repair2.yml
          rm -f .github/workflows/subtitle-editor-repair3.yml
          rm -f .github/workflows/integrate-video-editor.yml
          rm -f .github/workflows/integrate-video-editor-v2.yml
          rm -f .github/workflows/editor-patch-now.yml
          rm -f .github/workflows/fix-video-editor-v3.yml
          rm -f .github/workflows/fix-editor-final.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py packages.txt .github/workflows editor_section.py.txt
          git diff --cached --quiet && echo 'No changes' || (git commit -m 'fix: restore multilingual subtitle editor' && git push)
