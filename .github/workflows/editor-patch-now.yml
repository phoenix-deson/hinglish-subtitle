name: Direct Subtitle Editor Repair
on:
  push:
    branches:
      - main
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Patch editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('app.py')
          text = p.read_text(encoding='utf-8')
          marker = '# ==================== VIDEO EDITOR'
          pos = text.find(marker)
          if pos < 0:
              raise SystemExit('EDITOR_MARKER_NOT_FOUND')
          text = text[:pos].rstrip() + r'''

# ==================== VIDEO EDITOR FINAL ====================

def editor_parse_time(value):
    value = value.strip().replace('.', ',')
    m = re.match(r'^(\d+):(\d+):(\d+),(\d+)$', value)
    if not m:
        raise ValueError(value)
    h, mi, s, ms = map(int, m.groups())
    return h * 3600 + mi * 60 + s + ms / 1000.0


def editor_parse_srt(content):
    content = content.replace('\r\n', '\n').replace('\r', '\n').strip()
    blocks = re.split(r'\n\s*\n', content)
    result = []
    for block in blocks:
        lines = block.splitlines()
        ti = next((i for i, line in enumerate(lines) if '-->' in line), None)
        if ti is None or ti + 1 >= len(lines):
            continue
        try:
            a, b = lines[ti].split('-->', 1)
            start = editor_parse_time(a.strip().split()[0])
            end = editor_parse_time(b.strip().split()[0])
        except Exception:
            continue
        # Preserve bilingual SRT line breaks instead of flattening them into one line.
        subtitle = '\n'.join(x.rstrip() for x in lines[ti + 1:]).strip()
        if subtitle and end > start:
            result.append([start, end, subtitle])
    return result


def editor_ass_escape(value):
    return str(value).replace('\\', r'\\').replace('{', r'\\{').replace('}', r'\\}')


def editor_ass_color(value):
    h = str(value).lstrip('#')
    if len(h) != 6:
        h = 'FFFFFF'
    return f'&H00{h[4:6]}{h[2:4]}{h[0:2]}'


def editor_font_for_char(ch):
    o = ord(ch)
    if 0x4E00 <= o <= 0x9FFF or 0x3400 <= o <= 0x4DBF:
        return 'Noto Sans CJK SC'
    if 0x3040 <= o <= 0x30FF:
        return 'Noto Sans CJK JP'
    if 0xAC00 <= o <= 0xD7AF:
        return 'Noto Sans CJK KR'
    if 0x0900 <= o <= 0x097F:
        return 'Noto Sans Devanagari'
    if 0x0600 <= o <= 0x06FF or 0x0750 <= o <= 0x077F or 0x08A0 <= o <= 0x08FF:
        return 'Noto Sans Arabic'
    if 0x0E00 <= o <= 0x0E7F:
        return 'Noto Sans Thai'
    if 0x0590 <= o <= 0x05FF:
        return 'Noto Sans Hebrew'
    return None


def editor_units(ch):
    o = ord(ch)
    if ch.isspace():
        return 0.35
    if 0x4E00 <= o <= 0x9FFF or 0x3400 <= o <= 0x4DBF or 0x3040 <= o <= 0x30FF or 0xAC00 <= o <= 0xD7AF:
        return 1.0
    if 0x0900 <= o <= 0x097F or 0x0600 <= o <= 0x06FF or 0x0750 <= o <= 0x077F or 0x0E00 <= o <= 0x0E7F or 0x0590 <= o <= 0x05FF:
        return 0.95
    if o >= 0x1F300:
        return 1.0
    return 0.55


def editor_wrap_line(line, limit):
    line = str(line).strip()
    if not line:
        return ''
    # Space-free scripts: wrap by approximate display width.
    if ' ' not in line and any(editor_units(c) >= 0.95 for c in line):
        out, buf, units = [], [], 0.0
        for ch in line:
            w = editor_units(ch)
            if buf and units + w > limit:
                out.append(''.join(buf))
                buf, units = [], 0.0
            buf.append(ch)
            units += w
        if buf:
            out.append(''.join(buf))
        return '\n'.join(out)
    # Latin/mixed scripts: prefer word boundaries, with a fallback for very long words.
    out, buf, units = [], [], 0.0
    for word in line.split():
        w = sum(editor_units(c) for c in word)
        sep = 0.35 if buf else 0.0
        if buf and units + sep + w > limit:
            out.append(' '.join(buf))
            buf, units = [], 0.0
        if w <= limit:
            buf.append(word)
            units += sep + w
        else:
            if buf:
                out.append(' '.join(buf))
                buf, units = [], 0.0
            chunk, cu = [], 0.0
            for ch in word:
                cw = editor_units(ch)
                if chunk and cu + cw > limit:
                    out.append(''.join(chunk))
                    chunk, cu = [], 0.0
                chunk.append(ch)
                cu += cw
            if chunk:
                buf, units = chunk, cu
    if buf:
        out.append(' '.join(buf))
    return '\n'.join(out)


def editor_wrap_bilingual(text, limit):
    text = str(text).replace('\r\n', '\n').replace('\r', '\n')
    return '\n'.join(editor_wrap_line(part, limit) for part in text.split('\n'))


def editor_ass_runs(text, base_font):
    out, buf, active = [], [], None
    def flush():
        nonlocal buf, active
        if not buf:
            return
        chunk = editor_ass_escape(''.join(buf))
        if active and active != base_font:
            out.append(r'{\fn' + active + '}' + chunk + r'{\fn' + base_font + '}')
        else:
            out.append(chunk)
        buf = []
    for ch in str(text):
        if ch == '\n':
            flush()
            out.append(r'\N')
            active = None
            continue
        wanted = editor_font_for_char(ch) or base_font
        if active is None:
            active = wanted
        elif wanted != active:
            flush()
            active = wanted
        buf.append(ch)
    flush()
    return ''.join(out)


def editor_ass_time(seconds):
    total = max(0, int(round(float(seconds) * 100)))
    cs = total % 100
    total //= 100
    s = total % 60
    total //= 60
    m = total % 60
    h = total // 60
    return f'{h}:{m:02d}:{s:02d}.{cs:02d}'


def editor_build_ass(segments, font_name, font_size, text_color, bold, italic, underline, position, margin_v, outline_width, outline_color, wrap_width):
    alignment = {'Bottom': 2, 'Middle': 5, 'Top': 8}[position]
    b = -1 if bold else 0
    i = -1 if italic else 0
    u = -1 if underline else 0
    lines = [
        '[Script Info]', 'ScriptType: v4.00+', 'PlayResX: 1920', 'PlayResY: 1080',
        'WrapStyle: 2', 'ScaledBorderAndShadow: yes', '', '[V4+ Styles]',
        'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
        f'Style: Default,{font_name},{font_size},{editor_ass_color(text_color)},&H00FFFFFF,{editor_ass_color(outline_color)},&HFF000000,{b},{i},{u},0,100,100,0,0,1,{int(outline_width)},0,{alignment},70,70,{int(margin_v)},1',
        '', '[Events]', 'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text'
    ]
    for start, end, raw in segments:
        rendered = editor_ass_runs(editor_wrap_bilingual(raw, wrap_width), font_name)
        lines.append(f'Dialogue: 0,{editor_ass_time(start)},{editor_ass_time(end)},Default,,0,0,0,,{rendered}')
    return '\n'.join(lines) + '\n'


def editor_render_video(video_path, ass_path, output_path):
    ffmpeg = find_ffmpeg()
    if not ffmpeg:
        raise RuntimeError('FFmpeg was not found. Add ffmpeg to packages.txt and redeploy.')
    vf = "subtitles='" + str(ass_path).replace('\\', '\\\\').replace("'", "\\'") + "'"
    cmd = [ffmpeg, '-y', '-hide_banner', '-loglevel', 'error', '-i', str(video_path), '-vf', vf,
           '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '18', '-c:a', 'aac', '-b:a', '192k',
           '-movflags', '+faststart', str(output_path)]
    r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
    if r.returncode != 0:
        raise RuntimeError('Subtitle rendering failed.\n' + (r.stderr or 'Unknown FFmpeg error.')[-3000:])


with video_editor_tab:
    st.subheader('🎬 Video Subtitle Editor')
    st.caption('Bilingual SRT lines are preserved. Long subtitles wrap automatically. Multilingual fonts are selected per script.')
    left, right = st.columns(2)
    with left:
        editor_video = st.file_uploader('Upload video', type=SUPPORTED_TYPES, key='editor_final_video')
    with right:
        editor_srt = st.file_uploader('Upload SRT subtitle', type=['srt'], key='editor_final_srt')

    if editor_video and editor_srt:
        raw_srt = editor_srt.getvalue().decode('utf-8-sig', errors='replace')
        key = editor_srt.name + ':' + str(len(raw_srt))
        if st.session_state.get('editor_final_key') != key:
            st.session_state.editor_final_segments = editor_parse_srt(raw_srt)
            st.session_state.editor_final_key = key
        segments = st.session_state.get('editor_final_segments', [])
        if not segments:
            st.error('No valid subtitle cues were found in this SRT.')
        else:
            st.video(editor_video)
            st.markdown(f'**{len(segments)} subtitle cues loaded**')
            for idx, cue in enumerate(segments):
                with st.expander(f'Subtitle {idx + 1} · {format_time(cue[0])}', expanded=(idx == 0)):
                    a, b = st.columns(2)
                    with a:
                        cue[0] = st.number_input('Start (seconds)', min_value=0.0, value=float(cue[0]), step=0.1, key=f'ef_s_{idx}')
                    with b:
                        cue[1] = st.number_input('End (seconds)', min_value=0.0, value=float(cue[1]), step=0.1, key=f'ef_e_{idx}')
                    cue[2] = st.text_area('Subtitle text', value=cue[2], height=120, key=f'ef_t_{idx}')
            st.markdown('### 🎨 Subtitle style')
            a, b, c = st.columns(3)
            with a:
                font_name = st.selectbox('Base font', ['Noto Sans', 'Noto Sans CJK SC', 'DejaVu Sans', 'Liberation Sans'], key='ef_font')
                font_size = st.slider('Font size', 18, 96, 42, key='ef_size')
                text_color = st.color_picker('Text color', '#FFFFFF', key='ef_text')
            with b:
                bold = st.checkbox('Bold', True, key='ef_bold')
                italic = st.checkbox('Italic', False, key='ef_italic')
                underline = st.checkbox('Underline', False, key='ef_under')
                position = st.selectbox('Position', ['Bottom', 'Middle', 'Top'], key='ef_pos')
                margin_v = st.slider('Vertical margin', 10, 240, 60, key='ef_margin')
            with c:
                outline_width = st.slider('Outline width', 0, 8, 3, key='ef_outline')
                outline_color = st.color_picker('Outline color', '#000000', key='ef_outline_color')
                wrap_width = st.slider('Auto-wrap width', 18, 60, 34, key='ef_wrap')
                st.caption('Transparent background · script-specific fonts · automatic wrapping')
            if st.button('🎬 Render video', type='primary', key='ef_render'):
                work = Path(tempfile.mkdtemp(prefix='hinglish_editor_'))
                try:
                    video_path = work / ('input' + (Path(editor_video.name).suffix.lower() or '.mp4'))
                    ass_path = work / 'subtitles.ass'
                    output_path = work / 'output.mp4'
                    video_path.write_bytes(editor_video.getbuffer())
                    ass_path.write_text(editor_build_ass(segments, font_name, font_size, text_color, bold, italic, underline, position, margin_v, outline_width, outline_color, wrap_width), encoding='utf-8')
                    with st.spinner('Rendering subtitles into the video...'):
                        editor_render_video(video_path, ass_path, output_path)
                    st.success('Video rendered successfully.')
                    st.video(str(output_path))
                    st.download_button('⬇️ Download MP4', data=output_path.read_bytes(), file_name=Path(editor_video.name).stem + '_subtitled.mp4', mime='video/mp4', key='ef_download')
                except Exception as exc:
                    st.error(str(exc))
          '''
          p.write_text(text, encoding='utf-8')

          packages = Path('packages.txt')
          old = packages.read_text(encoding='utf-8').splitlines() if packages.exists() else []
          required = ['ffmpeg', 'fontconfig', 'fonts-noto-cjk', 'fonts-noto-core', 'fonts-noto-extra', 'fonts-noto-mono', 'fonts-noto-color-emoji']
          values = []
          for x in old + required:
              x = x.strip()
              if x and x not in values:
                  values.append(x)
          packages.write_text('\n'.join(values) + '\n', encoding='utf-8')
          PY
      - name: Validate Python
        run: python -m py_compile app.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py packages.txt
          git commit -m "fix: repair multilingual subtitle editor [editor-final]"
          git push
