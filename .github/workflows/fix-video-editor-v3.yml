name: Repair Video Editor v3

on:
  push:
    branches:
      - main

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[integrated]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Replace old editor with multilingual editor
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('app.py')
          text = p.read_text(encoding='utf-8')

          # The repository already contains the frozen three modules and an older
          # editor appended after the footer. Remove only that old editor block.
          marker = 'st.set_page_config(page_title="Video Subtitle Editor", page_icon="🎬", layout="wide")'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'

          # Guarantee the fourth tab without touching the frozen modules.
          old_tab = re.compile(r'recognition_tab,correction_tab,translation_tab\s*=\s*st\.tabs\(\[.*?\]\)')
          new_tab = 'recognition_tab,correction_tab,translation_tab,video_editor_tab=st.tabs(["🎙️ Speech Recognition","✨ AI Correction","🌐 Translation","🎬 Video Editor"])'
          text, n = old_tab.subn(new_tab, text, count=1)
          if n == 0 and 'video_editor_tab=' not in text:
              raise SystemExit('Could not find the existing tab declaration.')

          editor = r'''

# ==================== VIDEO EDITOR ====================
# Isolated from the frozen recognition, correction and translation pipeline.

def editor_parse_srt_time(value):
    value = value.strip().replace('.', ',')
    m = re.fullmatch(r'(\d+):(\d{2}):(\d{2}),(\d{1,3})', value)
    if not m:
        raise ValueError(value)
    h, mi, sec, ms = m.groups()
    return int(h) * 3600 + int(mi) * 60 + int(sec) + int(ms.ljust(3, '0')) / 1000


def editor_parse_srt(content):
    blocks = re.split(r'\n\s*\n', content.replace('\r\n', '\n').replace('\r', '\n').strip())
    result = []
    for block in blocks:
        lines = block.splitlines()
        ti = next((i for i, line in enumerate(lines) if '-->' in line), None)
        if ti is None or ti + 1 >= len(lines):
            continue
        try:
            start_raw, end_raw = [x.strip().split()[0] for x in lines[ti].split('-->', 1)]
            start = editor_parse_srt_time(start_raw)
            end = editor_parse_srt_time(end_raw)
        except Exception:
            continue
        # IMPORTANT: preserve SRT line breaks. Bilingual SRTs use line 1 for
        # the original and line 2 for the translation.
        subtitle = '\n'.join(x.rstrip() for x in lines[ti + 1:]).strip()
        if subtitle and end > start:
            result.append([start, end, subtitle])
    return result


def editor_ass_escape(text):
    # ASS uses braces for override tags; escape literal braces and backslashes.
    return str(text).replace('\\', r'\\').replace('{', r'\{').replace('}', r'\}')


def editor_ass_color(hex_color):
    h = str(hex_color).lstrip('#')
    if len(h) != 6:
        h = 'FFFFFF'
    return f'&H00{h[4:6]}{h[2:4]}{h[0:2]}'


def editor_script_font(ch):
    o = ord(ch)
    if 0x4E00 <= o <= 0x9FFF or 0x3400 <= o <= 0x4DBF:
        return 'Noto Sans CJK SC'
    if 0x3040 <= o <= 0x30FF:
        return 'Noto Sans CJK JP'
    if 0xAC00 <= o <= 0xD7AF:
        return 'Noto Sans CJK KR'
    if 0x0900 <= o <= 0x097F:
        return 'Noto Sans Devanagari'
    if 0x0600 <= o <= 0x06FF or 0x0750 <= o <= 0x077F:
        return 'Noto Sans Arabic'
    if 0x0E00 <= o <= 0x0E7F:
        return 'Noto Sans Thai'
    if 0x0590 <= o <= 0x05FF:
        return 'Noto Sans Hebrew'
    if 0x0400 <= o <= 0x04FF:
        return 'Noto Sans'
    return None


def editor_font_runs(text, default_font):
    out = []
    current = None
    buf = []

    def flush():
        nonlocal buf, current
        if not buf:
            return
        chunk = editor_ass_escape(''.join(buf))
        if current and current != default_font:
            out.append(r'{\fn' + current + '}' + chunk + r'{\fn' + default_font + '}')
        else:
            out.append(chunk)
        buf = []

    for ch in str(text):
        if ch in '\r\n':
            flush()
            out.append(r'\N')
            current = None
            continue
        font = editor_script_font(ch) or default_font
        if current is None:
            current = font
        if font != current:
            flush()
            current = font
        buf.append(ch)
    flush()
    return ''.join(out)


def editor_char_width(ch):
    o = ord(ch)
    if ch.isspace():
        return 0.35
    if 0x4E00 <= o <= 0x9FFF or 0x3400 <= o <= 0x4DBF or 0x3040 <= o <= 0x30FF or 0xAC00 <= o <= 0xD7AF:
        return 1.0
    if 0x0900 <= o <= 0x097F or 0x0600 <= o <= 0x06FF or 0x0E00 <= o <= 0x0E7F or 0x0590 <= o <= 0x05FF:
        return 0.95
    if o >= 0x1F300:
        return 1.0
    return 0.55


def editor_wrap_line(line, max_units):
    line = str(line).strip()
    if not line:
        return ''

    # For languages without word spaces, wrap by glyph width.
    if ' ' not in line and any(editor_char_width(c) >= 0.95 for c in line):
        rows, buf, width = [], [], 0.0
        for ch in line:
            w = editor_char_width(ch)
            if buf and width + w > max_units:
                rows.append(''.join(buf))
                buf, width = [], 0.0
            buf.append(ch)
            width += w
        if buf:
            rows.append(''.join(buf))
        return '\n'.join(rows)

    # For space-delimited languages, wrap at word boundaries. Mixed Latin/CJK
    # subtitles still use the same width estimate, so long bilingual lines do not overflow.
    rows, buf, width = [], [], 0.0
    for word in line.split():
        ww = sum(editor_char_width(c) for c in word)
        sep = 0.35 if buf else 0.0
        if buf and width + sep + ww > max_units:
            rows.append(' '.join(buf))
            buf, width = [word], ww
        else:
            buf.append(word)
            width += sep + ww
    if buf:
        rows.append(' '.join(buf))
    return '\n'.join(rows)


def editor_wrap_text(text, max_units):
    # Each pre-existing SRT line is wrapped independently, preserving the bilingual layout.
    normalized = str(text).replace('\r\n', '\n').replace('\r', '\n')
    return '\n'.join(editor_wrap_line(line, max_units) for line in normalized.split('\n'))


def editor_ass_time(seconds):
    total = max(0, int(round(float(seconds) * 100)))
    cs = total % 100
    total //= 100
    sec = total % 60
    total //= 60
    minute = total % 60
    hour = total // 60
    return f'{hour}:{minute:02d}:{sec:02d}.{cs:02d}'


def editor_build_ass(segments, font_name, font_size, text_color, bold, italic, underline,
                     position, margin_v, outline_width, outline_color, wrap_units):
    alignment = {'Bottom': 2, 'Middle': 5, 'Top': 8}[position]
    primary = editor_ass_color(text_color)
    outline = editor_ass_color(outline_color)
    b = -1 if bold else 0
    i = -1 if italic else 0
    u = -1 if underline else 0
    lines = [
        '[Script Info]',
        'ScriptType: v4.00+',
        'PlayResX: 1920',
        'PlayResY: 1080',
        'WrapStyle: 2',
        'ScaledBorderAndShadow: yes',
        '',
        '[V4+ Styles]',
        'Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding',
        f'Style: Default,{font_name},{font_size},{primary},&H00FFFFFF,{outline},&H00000000,{b},{i},{u},0,100,100,0,0,1,{int(outline_width)},0,{alignment},80,80,{int(margin_v)},1',
        '',
        '[Events]',
        'Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text',
    ]
    for start, end, raw_text in segments:
        wrapped = editor_wrap_text(raw_text, wrap_units)
        rendered = editor_font_runs(wrapped, font_name)
        lines.append(f'Dialogue: 0,{editor_ass_time(start)},{editor_ass_time(end)},Default,,0,0,0,,{rendered}')
    return '\n'.join(lines) + '\n'


def editor_ffmpeg():
    path = shutil.which('ffmpeg')
    if path:
        return path
    for candidate in ('/usr/bin/ffmpeg', '/usr/local/bin/ffmpeg', '/opt/homebrew/bin/ffmpeg', '/opt/conda/bin/ffmpeg'):
        if os.path.isfile(candidate) and os.access(candidate, os.X_OK):
            return candidate
    return None


def editor_render_video(video_path, ass_path, output_path):
    ffmpeg = editor_ffmpeg()
    if not ffmpeg:
        raise RuntimeError('FFmpeg was not found. Add ffmpeg to packages.txt and redeploy.')
    # libass + fontconfig handles the installed Noto families. The ASS file
    # additionally selects a font per script run to avoid square/missing glyphs.
    vf = "subtitles='" + str(ass_path).replace('\\', '\\\\').replace("'", "\\'") + "'"
    cmd = [ffmpeg, '-y', '-hide_banner', '-loglevel', 'error', '-i', str(video_path),
           '-vf', vf, '-c:v', 'libx264', '-preset', 'veryfast', '-crf', '18',
           '-c:a', 'aac', '-b:a', '192k', '-movflags', '+faststart', str(output_path)]
    r = subprocess.run(cmd, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=True)
    if r.returncode != 0:
        raise RuntimeError('Subtitle rendering failed.\n' + (r.stderr or 'Unknown FFmpeg error.')[-2500:])


with video_editor_tab:
    st.subheader('🎬 Video Subtitle Editor')
    st.caption('Edit SRT subtitles with automatic wrapping and multilingual font rendering. Bilingual source/translation lines are preserved. Subtitle background remains transparent.')

    left, right = st.columns(2)
    with left:
        editor_video = st.file_uploader('Upload video', type=SUPPORTED_TYPES, key='video_editor_video_v3')
    with right:
        editor_srt = st.file_uploader('Upload SRT subtitle', type=['srt'], key='video_editor_srt_v3')

    if editor_video and editor_srt:
        srt_name = editor_srt.name
        if st.session_state.get('video_editor_srt_name_v3') != srt_name:
            st.session_state.video_editor_data_v3 = editor_parse_srt(editor_srt.getvalue().decode('utf-8-sig', errors='replace'))
            st.session_state.video_editor_srt_name_v3 = srt_name

        data = st.session_state.get('video_editor_data_v3', [])
        if not data:
            st.error('No valid subtitle cues were found in this SRT.')
        else:
            st.video(editor_video)
            st.caption(f'{len(data)} subtitle cues loaded')
            for idx, cue in enumerate(data):
                with st.expander(f'Subtitle {idx + 1} · {format_time(cue[0])}', expanded=(idx == 0)):
                    a, b = st.columns(2)
                    with a:
                        cue[0] = st.number_input('Start (seconds)', min_value=0.0, value=float(cue[0]), step=0.1, key=f'v3_start_{idx}')
                    with b:
                        cue[1] = st.number_input('End (seconds)', min_value=0.0, value=float(cue[1]), step=0.1, key=f'v3_end_{idx}')
                    cue[2] = st.text_area('Subtitle text', value=cue[2], height=120, key=f'v3_text_{idx}')

            st.markdown('### 🎨 Subtitle style')
            s1, s2, s3 = st.columns(3)
            with s1:
                font_name = st.selectbox('Base font', ['Noto Sans', 'Noto Sans CJK SC', 'DejaVu Sans', 'Liberation Sans'], index=0, key='v3_font')
                font_size = st.slider('Font size', 18, 96, 42, key='v3_size')
                text_color = st.color_picker('Text color', '#FFFFFF', key='v3_text_color')
            with s2:
                bold = st.checkbox('Bold', True, key='v3_bold')
                italic = st.checkbox('Italic', False, key='v3_italic')
                underline = st.checkbox('Underline', False, key='v3_underline')
                position = st.selectbox('Position', ['Bottom', 'Middle', 'Top'], index=0, key='v3_position')
                margin_v = st.slider('Vertical margin', 10, 240, 60, key='v3_margin')
            with s3:
                outline_width = st.slider('Outline width', 0, 8, 3, key='v3_outline')
                outline_color = st.color_picker('Outline color', '#000000', key='v3_outline_color')
                wrap_units = st.slider('Auto-wrap width', 18, 60, 34, key='v3_wrap')
                st.caption('Original and translated lines wrap independently. No black box is used.')

            if st.button('🎬 Render video', type='primary', use_container_width=True, key='v3_render'):
                work = tempfile.mkdtemp(prefix='hinglish_editor_v3_')
                try:
                    suffix = Path(editor_video.name).suffix.lower() or '.mp4'
                    video_path = Path(work) / ('input' + suffix)
                    ass_path = Path(work) / 'subtitles.ass'
                    output_path = Path(work) / 'output.mp4'
                    video_path.write_bytes(editor_video.getbuffer())
                    ass_path.write_text(editor_build_ass(data, font_name, font_size, text_color, bold, italic, underline,
                                                          position, margin_v, outline_width, outline_color, wrap_units), encoding='utf-8-sig')
                    with st.spinner('Rendering multilingual subtitles…'):
                        editor_render_video(video_path, ass_path, output_path)
                    st.success('Video rendered successfully.')
                    st.video(str(output_path))
                    st.download_button('⬇️ Download MP4', data=output_path.read_bytes(), file_name=Path(editor_video.name).stem + '_subtitled.mp4', mime='video/mp4', key='v3_download')
                except Exception as exc:
                    st.error(str(exc))
                finally:
                    shutil.rmtree(work, ignore_errors=True)
'''

          text += editor
          p.write_text(text, encoding='utf-8')
          PY

      - name: Install multilingual subtitle fonts
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('packages.txt')
          existing = [x.strip() for x in p.read_text(encoding='utf-8').splitlines()] if p.exists() else []
          needed = ['ffmpeg', 'fontconfig', 'fonts-noto-core', 'fonts-noto-cjk', 'fonts-noto-extra', 'fonts-noto-mono']
          for item in needed:
              if item not in existing:
                  existing.append(item)
          p.write_text('\n'.join(existing) + '\n', encoding='utf-8')
          PY

      - name: Remove old editor page
        run: |
          rm -f 'pages/4_🎬_Video_Editor.py'
          rm -f '.github/workflows/integrate-video-editor.yml'
          rm -f '.github/workflows/integrate-video-editor-v2.yml'
          rm -f '.github/workflows/fix-video-editor-v3.yml'

      - name: Validate syntax
        run: python -m py_compile app.py

      - name: Commit final integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: fix multilingual subtitle editor [integrated]'
          git push
