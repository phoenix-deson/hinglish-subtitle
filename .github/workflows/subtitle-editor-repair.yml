name: Repair subtitle editor

on:
  push:
    paths:
      - '.github/workflows/subtitle-editor-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch app.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.py')
          text = path.read_text(encoding='utf-8')
          marker = 'st.set_page_config(page_title="Video Subtitle Editor", page_icon="🎬", layout="wide")'
          if marker not in text:
              raise SystemExit('Editor marker not found in app.py')

          editor = r'''EDITOR_CODE_PLACEHOLDER'''
          path.write_text(text.split(marker, 1)[0] + editor.lstrip('\n') + '\n', encoding='utf-8')
          PY

      - name: Update multilingual font packages
        run: |
          cat > packages.txt <<'EOF'
          ffmpeg
          fontconfig
          fonts-noto-cjk
          fonts-noto-core
          fonts-noto-extra
          fonts-noto-mono
          fonts-noto-color-emoji
          EOF

      - name: Validate Python
        run: python -m py_compile app.py

      - name: Remove old temporary editor workflows
        run: |
          rm -f .github/workflows/integrate-video-editor.yml
          rm -f .github/workflows/integrate-video-editor-v2.yml
          rm -f .github/workflows/editor-patch-now.yml
          rm -f .github/workflows/fix-video-editor-v3.yml
          rm -f .github/workflows/fix-editor-final.yml

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py packages.txt .github/workflows
          git diff --cached --quiet && echo 'No changes to commit.' || git commit -m 'fix: multilingual subtitle wrapping and font fallback'
          git push
