name: Final subtitle editor repair

on:
  push:
    paths:
      - '.github/workflows/subtitle-editor-repair2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore editor code
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py')
          text = app.read_text(encoding='utf-8')
          marker = 'st.set_page_config(page_title="Video Subtitle Editor", page_icon="🎬", layout="wide")'
          section = Path('editor_section.py.txt').read_text(encoding='utf-8')
          if marker not in text:
              raise SystemExit('Editor marker not found')
          app.write_text(text.split(marker, 1)[0] + section.lstrip('\n') + '\n', encoding='utf-8')
          PY
      - name: Update packages
        run: |
          cat > packages.txt <<'EOF'
          ffmpeg
          fontconfig
          fonts-noto-cjk
          fonts-noto-core
          fonts-noto-extra
          fonts-noto-mono
          fonts-noto-color-emoji
          EOF
      - name: Validate
        run: python -m py_compile app.py
      - name: Clean temporary repair files
        run: |
          rm -f editor_section.py.txt
          rm -f .github/workflows/subtitle-editor-repair.yml
          rm -f .github/workflows/subtitle-editor-repair2.yml
          rm -f .github/workflows/integrate-video-editor.yml
          rm -f .github/workflows/integrate-video-editor-v2.yml
          rm -f .github/workflows/editor-patch-now.yml
          rm -f .github/workflows/fix-video-editor-v3.yml
          rm -f .github/workflows/fix-editor-final.yml
      - name: Commit final repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py packages.txt .github/workflows editor_section.py.txt
          git diff --cached --quiet && echo 'No changes' || (git commit -m 'fix: multilingual subtitle wrapping and font fallback' && git push)
